<div class="page tv-page" id="pageTvBoard">
  <header class="tv-head">
    <div class="tv-brand">
      <img src="/assets/qficient-logo-white.png" alt="" width="40" height="40">
      <span>QFicient</span>
      <span class="tv-preset" id="tvPresetName" hidden></span>
    </div>
    <div class="tv-head-right">
      <button type="button" class="tv-change" id="tvChangeBtn" onclick="changeTvPreset()" title="Show a different preset" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Change
      </button>
      <button type="button" class="tv-sound" id="tvSoundBtn" onclick="toggleTvSound()"></button>
      <button type="button" class="tv-fullscreen" onclick="toggleTvFullscreen()" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <span class="tv-hours" id="tvHours" hidden></span>
      <span class="tv-clock" id="tvClock"></span>
    </div>
  </header>

  <main class="tv-main" id="tvBoard" aria-live="polite"></main>

  <footer class="tv-foot">Making Every Queue Efficient.</footer>
</div>

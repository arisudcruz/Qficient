<div class="page admin-login-page" id="pageAdminLogin">
  <div class="al-shell">
    <div class="al-photo" role="img" aria-label="A laptop on a desk showing the QFicient dashboard"></div>

    <section class="al-panel">
      <div class="al-top">
        <div class="al-brand">
          <img src="/assets/qficient-logo-navy.png" alt="" width="34" height="34">
          <span>QFicient</span>
        </div>
        <button type="button" class="al-back" onclick="goTo('pageHome')">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Back
        </button>
      </div>

      <h1 class="al-title">Welcome Back <span aria-hidden="true">👋</span></h1>
      <p class="al-sub" id="adminLoginSub">Sign in with your admin or staff account to continue.</p>

      <hr class="al-divider">

      <form id="adminLoginForm" onsubmit="adminLogin(event)" novalidate>
        <label for="adminEmail">Username</label>
        <input type="text" id="adminEmail" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" placeholder="Enter your username">

        <label for="adminPassword">Password</label>
        <div class="pw-field">
          <input type="password" id="adminPassword" autocomplete="current-password" placeholder="Enter your password">
          <button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false" title="Show password" onclick="togglePasswordVisibility(this)">
            <svg class="pw-eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pw-eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.4 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
          </button>
        </div>

        <p class="admin-login-error" id="adminLoginError" role="alert" style="display: none"></p>

        <button type="submit" class="al-submit" id="adminLoginSubmit">Sign In</button>
      </form>
    </section>
  </div>
</div>

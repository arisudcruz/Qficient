<div class="page" id="pageGuest">
  <span class="backLink" onclick="goTo('pageHome')">← Back</span>
  <h1>Guest Queue Access</h1>
  <p class="small">You'll be routed automatically to Admission.</p>

  <label>Full Name</label>
  <input type="text" id="guestName" placeholder="Juan Dela Cruz">

  <label>Mobile Number</label>
  <input type="text" id="guestMobile" placeholder="09XX XXX XXXX">

  <label>Purpose</label>
  <input type="text" id="guestPurpose" placeholder="e.g. New student admission">

  <div id="guestRecaptcha"></div>

  <div id="guestOtpSection" style="display:none;">
    <label>Verification Code</label>
    <input type="text" id="guestOtp" placeholder="Enter 6-digit code">
    <button class="bigBtn" onclick="verifyGuestOtp()">Verify SMS Code</button>
  </div>

  <button class="bigBtn" onclick="requestGuestOtp()">Send SMS Code</button>
</div>

<div class="page app-page" id="pageGuest">
  <div class="app-header">
    <button type="button" class="app-icon-btn" onclick="goTo('pageHome')" aria-label="Back">←</button>
    <span class="app-header-title">Guest Access</span>
    <span class="app-icon-btn app-icon-btn-ghost"></span>
  </div>

  <div class="app-body">
    <p class="app-subtitle">Tell us a bit about yourself, then pick the service you need.</p>

    <div class="app-field-row">
      <div class="app-field">
        <label for="guestFirstName">First Name*</label>
        <input type="text" id="guestFirstName" placeholder="Juan" autocomplete="given-name" maxlength="40" oninput="setGuestFieldError(this.id, '')">
        <p class="app-field-error" id="guestFirstNameError" role="alert"></p>
      </div>

      <div class="app-field">
        <label for="guestLastName">Last Name*</label>
        <input type="text" id="guestLastName" placeholder="Dela Cruz" autocomplete="family-name" maxlength="40" oninput="setGuestFieldError(this.id, '')">
        <p class="app-field-error" id="guestLastNameError" role="alert"></p>
      </div>
    </div>

    <div class="app-field">
      <label for="guestEmail">Email*</label>
      <input type="email" id="guestEmail" placeholder="juan@example.com" autocomplete="email" maxlength="254" oninput="setGuestFieldError(this.id, '')">
      <p class="app-field-error" id="guestEmailError" role="alert"></p>
    </div>

    <button type="button" class="app-btn app-btn-primary" id="guestContinueBtn" onclick="startGuestSession()">Continue as Guest</button>
  </div>
</div>

<div class="page" id="pageGuest">
  <span class="backLink" onclick="goTo('pageHome')">← Back</span>
  <h1>Guest Queue Access</h1>
  <p class="small">You'll be routed automatically to Admission.</p>

  <label>Full Name</label>
  <input type="text" id="guestName" placeholder="Juan Dela Cruz">

  <label>Mobile Number</label>
  <input type="text" id="guestMobile" placeholder="09XX XXX XXXX">

  <label>Purpose</label>
  <input type="text" id="guestPurpose" placeholder="e.g. New student admission">

  <button class="bigBtn" onclick="guestLogin()">Join Admission Queue</button>
</div>

<div class="page dashboard-page" id="pageAdmin">
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-badge">PL</div>
        <div class="brand-name">QFicient</div>
        <button type="button" class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar" aria-expanded="true" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="9" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="Main menu">
        <button type="button" class="nav-item active" data-section="dashboard" title="Dashboard" onclick="setAdminSection('dashboard')">
          <span class="nav-icon">◫</span>
          <span class="nav-text">Dashboard</span>
        </button>
        <button type="button" class="nav-item" data-section="queue" title="Queue Management" onclick="setAdminSection('queue')">
          <span class="nav-icon">◌</span>
          <span class="nav-text">Queue Management</span>
        </button>
        <button type="button" class="nav-item" data-section="enforcer" title="Queue Enforcer" onclick="setAdminSection('enforcer')">
          <span class="nav-icon">◈</span>
          <span class="nav-text">Queue Enforcer</span>
        </button>
        <button type="button" class="nav-item" data-section="notifications" title="Notifications" onclick="setAdminSection('notifications')">
          <span class="nav-icon">◍</span>
          <span class="nav-text">Notifications</span>
          <span class="nav-badge" id="notifBadge" style="display: none"></span>
        </button>
      </nav>

      <div class="admin-tools">
        <div class="tool-label">ADMIN TOOLS</div>
        <button type="button" class="tool-item" data-section="settings" title="Settings" onclick="setAdminSection('settings')">
          <span class="nav-icon">⚙</span>
          <span class="nav-text">Settings</span>
        </button>
        <button type="button" class="tool-item" data-section="rules" title="Rules" onclick="setAdminSection('rules')">
          <span class="nav-icon">⚖</span>
          <span class="nav-text">Rules</span>
        </button>
        <div class="admin-user-row" title="Admin User">
          <div class="user-badge">AU</div>
          <div class="user-meta">Admin User</div>
          <span class="caret">⌄</span>
        </div>
      </div>
    </aside>

    <main class="dashboard-main">
      <div id="adminServerBanner" class="server-banner" style="display: none"></div>
      <div id="adminArea"></div>
      <div id="adminQueueArea" style="display: none"></div>
      <div id="adminEnforcerArea" style="display: none"></div>
      <div id="adminNotificationsArea" style="display: none"></div>
      <div id="adminRulesArea" style="display: none"></div>
      <div id="adminSettingsArea" style="display: none"></div>
    </main>
  </div>
</div>
